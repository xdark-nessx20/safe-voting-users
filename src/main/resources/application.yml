spring:
  application:
    name: users
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:5432/safevoting_users
    username: ${DB_USER:safevoting}
    password: ${DB_PASS:safevoting_dev}
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/safevoting_users
    user: ${DB_USER:safevoting}
    password: ${DB_PASS:safevoting_dev}
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

jwt:
  secret: c2FmZXZvdGluZy1qd3Qtc2VjcmV0LWtleS0yMDI2LWJhc2U2NC1lbmNvZGVkLXN0cmluZw==
  expiration-minutes: 15

server:
  port: 8080

logging:
  level:
    com.safevoting.users: DEBUG
