services:
  postgres:
    image: postgres:16-alpine
    container_name: safevoting_postgres
    environment:
      POSTGRES_DB: safevoting_users
      POSTGRES_USER: safevoting
      POSTGRES_PASSWORD: safevoting_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safevoting -d safevoting_users"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: safevoting_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: .
    container_name: safevoting_users
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: safevoting
      DB_PASS: safevoting_dev
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
